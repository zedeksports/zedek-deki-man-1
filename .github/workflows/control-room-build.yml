name: Control Room Build Check

on:
  push:
    paths:
      - "control-room/**"
      - ".github/workflows/control-room-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-room/package-lock.json
      - run: npm install
      - run: npm run build
